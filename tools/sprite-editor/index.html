<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>INKFALL — sprite editor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%A6%91%3C/text%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 24px; background: #05090f; color: #9cb0b8;
             font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 13px; }
      h1 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #00e5cc; margin: 0 0 4px; }
      .sub { margin: 0 0 20px; color: #69808a; max-width: 62ch; line-height: 1.6; }
      .cols { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
      canvas { background: #0b1116; border: 1px solid #1d2b36; touch-action: none; cursor: crosshair; }
      #palette { display: flex; gap: 6px; margin: 14px 0; flex-wrap: wrap; }
      .swatch { width: 30px; height: 30px; border: 1px solid #1d2b36; border-radius: 3px;
                color: #e3eef0; font: inherit; font-size: 10px; cursor: pointer;
                background-image: linear-gradient(45deg,#141c24 25%,transparent 25%,transparent 75%,#141c24 75%),
                                  linear-gradient(45deg,#141c24 25%,transparent 25%,transparent 75%,#141c24 75%);
                background-size: 8px 8px; background-position: 0 0, 4px 4px; }
      .swatch.on { outline: 2px solid #00e5cc; outline-offset: 1px; }
      textarea { width: 100%; min-width: 380px; height: 340px; background: #0c151e; color: #9cb0b8;
                 border: 1px solid #1d2b36; border-radius: 4px; padding: 12px; font: inherit; resize: vertical; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
      input[type=text], input[type=number] { background: #0c151e; color: #e3eef0; border: 1px solid #1d2b36;
                 border-radius: 3px; padding: 6px 8px; font: inherit; width: 90px; }
      button { background: #0c151e; color: #e3eef0; border: 1px solid #1d2b36; border-bottom-width: 2px;
               border-radius: 4px; padding: 7px 13px; font: inherit; cursor: pointer; }
      button:hover { border-color: #00766a; }
      #status { min-height: 1.4em; margin: 10px 0 0; }
      label { color: #69808a; }
    </style>
  </head>
  <body>
    <h1>Sprite editor</h1>
    <p class="sub">
      Paints the palette-indexed nibble format the game loads. Paste a
      <code>SpriteDef</code> literal into the box and hit Load to edit it; the box
      updates as you paint. Round-tripping through Load and back is covered by
      <code>tests/sprite.test.ts</code>, so what you copy out is exactly what the
      game reads in.
    </p>
    <div class="cols">
      <div>
        <canvas id="grid" width="320" height="320"></canvas>
        <div id="palette"></div>
        <div class="row">
          <label for="name">name</label><input id="name" type="text" value="nibIdle" />
          <label for="w">w</label><input id="w" type="number" value="16" min="1" max="128" />
          <label for="h">h</label><input id="h" type="number" value="16" min="1" max="128" />
          <button id="resize" type="button">New</button>
          <button id="clear" type="button">Clear</button>
        </div>
      </div>
      <div style="flex:1; min-width:380px">
        <div class="row">
          <button id="load" type="button">Load from source</button>
          <button id="copy" type="button">Copy</button>
        </div>
        <textarea id="source" spellcheck="false" aria-label="Sprite source"></textarea>
        <p id="status"></p>
      </div>
    </div>
    <script type="module" src="./editor.ts"></script>
  </body>
</html>
